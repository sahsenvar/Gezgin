name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

  build:
    name: build-test-api-docs
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Test build logic
        run: ./gradlew -p buildSrc test --no-daemon --console=plain

      - name: Test release scripts
        run: ./gradle/release/test-release-scripts.sh

      - name: Run build, test, API, KDoc and Dokka gates
        run: >-
          ./gradlew
          check apiCheck checkPublicApiKDoc
          :gezgin-core:test :gezgin-core:jvmTest :gezgin-core:dokkaGenerate
          :gezgin-processor:test :gezgin-processor:dokkaGenerate
          :gezgin-test:jvmTest :gezgin-test:dokkaGenerate
          :sample:navigation:test :sample:shopr:test :sample:app:test
          :sample:app:assembleDebug :sample:shopr:assembleDebug
          :sample:hello:assembleDebug
          --no-daemon --console=plain

  ios:
    name: ios-compile-test
    needs: wrapper-validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up an Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Compile and test the Apple targets
        run: >-
          ./gradlew
          :gezgin-core:compileKotlinIosArm64
          :gezgin-core:compileKotlinIosSimulatorArm64
          :gezgin-core:iosSimulatorArm64Test
          :gezgin-test:compileKotlinIosArm64
          :gezgin-test:iosSimulatorArm64Test
          :sample:hello-shared:linkDebugFrameworkIosSimulatorArm64
          --no-daemon --console=plain

      # A target that runs zero tests also reports success, so the simulator run is only evidence
      # once the shared suites are named in its results.
      - name: Verify the simulator ran the shared suites
        shell: bash
        run: |
          set -euo pipefail
          results=gezgin-core/build/test-results/iosSimulatorArm64Test
          test -d "$results"
          total="$(grep -ho 'tests="[0-9]*"' "$results"/*.xml |
            grep -o '[0-9]*' | awk '{ sum += $1 } END { print sum + 0 }')"
          echo "iosSimulatorArm64Test executed $total tests."
          test "$total" -gt 0
          for suite in GezginDisplayTest GezginBottomSheetSceneTest GezginLocalsTest \
            PlatformViewModelStoreDecoratorTest RememberNavigatorSaveableRegistryTest \
            GezginDisplayProductionBackTest; do
            ls "$results" | grep -q "$suite" || {
              echo "the shared suite $suite did not run on the simulator" >&2
              exit 1
            }
          done

      # The Xcode project cannot be compiled anywhere else in this pipeline, so a hand-written
      # project would otherwise reach a reviewer unverified. Its build phase calls Gradle for the
      # Kotlin framework, which the step above has already warmed.
      - name: Build the iOS sample app
        run: >-
          xcodebuild
          -project sample/iosApp/iosApp.xcodeproj
          -target iosApp
          -configuration Debug
          -sdk iphonesimulator
          -arch arm64
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

  # The Maestro flows are the only iOS tests a compiler cannot reach: they drive the real
  # back gesture on a booted simulator. They run in their own job so their simulator boot and
  # driver startup stay off the compile job's critical path.
  ios-e2e:
    name: ios-maestro-e2e
    needs: wrapper-validation
    runs-on: macos-latest
    # A wedged simulator or driver otherwise holds a macOS runner for the six-hour default.
    timeout-minutes: 60
    env:
      # The iOS driver installs itself on the simulator on first use; CI runners are slower than
      # a laptop and the default startup budget expires before it is ready.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up an Android SDK
        uses: ./.github/actions/setup-android-sdk

      # The image's device list changes between runner updates, so the simulator is chosen from
      # what is actually available rather than pinned to a model name that may disappear.
      - name: Boot an iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items()):
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator on this runner")
          ')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          printf 'GEZGIN_SIMULATOR_UDID=%s\n' "$udid" >> "$GITHUB_ENV"

      # xcodebuild's build phase calls Gradle for the framework. Left cold that call carries the
      # whole Kotlin/Native build inside the Xcode step, where it is slow and hard to read.
      - name: Warm the shared framework
        run: >-
          ./gradlew :sample:hello-shared:linkDebugFrameworkIosSimulatorArm64
          --no-daemon --console=plain

      - name: Build and install the sample app on the simulator
        shell: bash
        run: |
          set -euo pipefail
          # The product directory is named outright rather than derived: xcodebuild rejects
          # -derivedDataPath without a scheme, and this project is driven by target.
          build_dir="$PWD/build/ios-e2e"
          xcodebuild \
            -project sample/iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$build_dir" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          xcrun simctl install "$GEZGIN_SIMULATOR_UDID" "$build_dir/iosApp.app"
          xcrun simctl get_app_container "$GEZGIN_SIMULATOR_UDID" dev.gezgin.sample.hello

      # Pinned to an exact release and checked against its digest: an install script fetched over
      # the network would decide for itself what runs here.
      - name: Install Maestro
        shell: bash
        env:
          MAESTRO_VERSION: '2.10.0'
          MAESTRO_SHA256: '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "$MAESTRO_SHA256  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      # The app's own console is the only place a swallowed exception would surface; Maestro's log
      # reports the command, not what the app did with it.
      - name: Capture the app's console
        shell: bash
        run: |
          set -uo pipefail
          nohup xcrun simctl spawn "$GEZGIN_SIMULATOR_UDID" log stream --style compact \
            --predicate 'processImagePath CONTAINS "iosApp"' \
            > "$RUNNER_TEMP/app-console.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/app-console.pid"

      - name: Run the iOS flows
        id: flows
        shell: bash
        env:
          MAESTRO_DEVICE: ${{ env.GEZGIN_SIMULATOR_UDID }}
        run: maestro/run-ios-all.sh

      # Maestro keeps each step's screenshot and command log under its own run directory; without
      # this a failure here is only a red X, and the flows cannot be debugged from the runner. A
      # crash on launch leaves its reason only in the simulator's own report, not in Maestro's log.
      - name: Report the failing flow
        # `failure()` alone skips this on a timeout, which is exactly when the evidence is needed.
        if: always() && steps.flows.outcome != 'success'
        shell: bash
        run: |
          # No single artifact is worth losing the rest of the report, so nothing here is fatal.
          set +e
          set -uo pipefail
          runs="$(ls -dt "$HOME"/.maestro/tests/* 2>/dev/null || true)"
          if [ -z "$runs" ]; then
            echo "Maestro wrote no run directory — it failed before starting a flow."
          else
            # Every flow gets its own run directory, so reporting only the newest hides three of
            # the four failures.
            for run in $runs; do
              echo "======== $run ========"
              ls -laR "$run"
              # The view hierarchy at the failing step says which screen was actually on top.
              find "$run" -path '*screen-hierarchy*' -name '*.json' -print0 |
                while IFS= read -r -d '' dump; do
                  echo "---- $dump ----"
                  head -c 20000 "$dump"
                  echo
                done
              # A hierarchy can disagree with the pixels — an empty tree over a rendered screen is
              # an accessibility fault, not a navigation one, and only the image tells them apart.
              # macOS base64 reads a file through -i; a bare path makes it exit 64 and, under the
              # runner's -e shell, takes the whole report down with it.
              find "$run" -path '*screenshots*' -name '*.png' -print0 |
                while IFS= read -r -d '' shot; do
                  echo "---- $shot (base64) ----"
                  base64 -i "$shot" || echo "(could not encode $shot)"
                  echo "---- end $shot ----"
                done
            done
          fi
          if [ -f "$RUNNER_TEMP/app-console.log" ]; then
            echo "---- app console ----"
            tail -200 "$RUNNER_TEMP/app-console.log"
          fi
          crash="$(ls -dt "$HOME"/Library/Logs/DiagnosticReports/iosApp-*.ips 2>/dev/null | head -1 || true)"
          if [ -n "$crash" ]; then
            echo "---- $crash ----"
            head -120 "$crash"
          else
            echo "The simulator recorded no crash report for iosApp."
          fi

  # Publishing runs on macOS because Kotlin/Native Apple targets only compile there. On Linux this
  # job would still succeed and silently omit every iOS artifact.
  release-artifacts:
    name: signed-local-publications
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up an Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Verify local signing prerequisites
        run: |
          java -version
          test -d "$ANDROID_HOME"
          gpg --version

      # Publishes only to a temporary local repository and uses an ephemeral GPG key.
      - name: Verify signed local release and isolated consumer
        run: ./gradle/verify-release-publications.sh
