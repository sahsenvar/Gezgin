name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'

permissions: read-all

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: java-kotlin
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build JVM and Android targets
        run: >-
          ./gradlew
          :gezgin-core:compileKotlinJvm :gezgin-core:compileDebugKotlinAndroid
          :gezgin-test:compileKotlinJvm :gezgin-test:compileDebugKotlinAndroid
          :gezgin-processor:compileKotlin
          :gezgin-gradle-plugin:compileKotlin
          :sample:navigation:compileKotlin :sample:app:compileDebugKotlin
          :sample:hello:compileDebugKotlin
          :sample:hello-shared:compileDebugKotlinAndroid
          --no-daemon --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
