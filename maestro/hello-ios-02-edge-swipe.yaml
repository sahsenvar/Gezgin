# iOS 2 — kenar-çekme (edge-swipe) jesti detayı pop'lar.
# Android'in predictive-back'iyle aynı sözleşme: jest, üst-bar geri'siyle birebir aynı sonucu verir.
# Jest, CMP'nin UIKit geri-olayı girdisinden `NavDisplay` üzerinden Gezgin'e ulaşır.
appId: dev.gezgin.sample.hello
---
- launchApp:
    clearState: true
- tapOn: "Barbara Liskov"
- assertVisible: "Favorilere ekle ☆"
# sol kenardan sağa tam çekme = iOS "interactive pop"
- swipe:
    start: "2%, 50%"
    end: "95%, 50%"
- assertNotVisible: "Favorilere ekle ☆"
- assertVisible: "Barbara Liskov"
- assertVisible: "Ada Lovelace"
# jest sonrası yığın tutarlı mı: yeniden push/pop edilebiliyor
- tapOn: "Ada Lovelace"
- assertVisible: "Favorilere ekle ☆"
- swipe:
    start: "2%, 50%"
    end: "95%, 50%"
- assertVisible: "Grace Hopper"
